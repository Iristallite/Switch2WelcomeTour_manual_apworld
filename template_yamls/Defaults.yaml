    'false': 0
    'true': 50

  techdemo11_vrr_slider:
    # Controls the "VRR Slider" tech demo specifically.
    # This tech demo requires handheld mode* and Joy-Con 2 mouse controls.
    # *VRR is not currently supported in TV mode. If it ever is,
    # I will be updating these options to account for that.
    'false': 0
    'true': 50

  techdemo12_hd_rumble_2_maker:
    # Controls the "HD Rumble 2 Maker" tech demo specifically.
    # This tech demo requires Joy-Con 2 mouse controls and HD Rumble 2.
    # Bizarrely enough, this tech demo is found at the Pro Controller 2,
