    'false': 0
    'true': 50

  techdemo13_hd_rumble_2_motorcycle:
    # Controls the "HD Rumble 2 Motorcycle" tech demo specifically.
    # This tech demo requires Joy-Con 2 motion controls and HD Rumble 2.
    'false': 0
    'true': 50

  techdemo14_3d_sound:
    # Controls the "3D Sound" tech demo specifically.
    'false': 0
    'true': 50

  #############
  # Minigames #
  #############
  minigame01_dodge_the_spiked_balls:
    # Controls the "Dodge the Spiked Balls" minigame specifically.
